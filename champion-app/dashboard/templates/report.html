<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report — Atlas Gate Champion App</title>
<style>{{CSS}}</style>
{{THEME_JS}}
</head>
<body>
{{HEADER}}
<main class="wrap">
  <p style="margin-bottom:10px"><a href="/reports">&larr; All reports</a></p>
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px">
    <h1 style="font-size:24px;letter-spacing:-.01em">{{REPORT_TITLE}}</h1>
    <span class="mono muted">{{REPORT_DATE}}</span>
  </div>
  <section class="card">
    <div class="card-b report-body" style="padding-top:14px">{{REPORT_BODY}}</div>
  </section>
</main>
{{FOOTER}}
</body>
</html>
